<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tachysensia</title>
<meta name="description" content="hızlı his.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%231c1b19'/><text x='16' y='22' font-family='Courier New,monospace' font-size='18' fill='%23d9d6d0' text-anchor='middle'>t_</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1c1b19;
    --ink: #dcd8cf;
    --dim: #7d7a73;
    --faint: #36342f;
    --type: "Courier Prime", "Courier New", Courier, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    color: var(--ink);
    font-family: var(--type);
    font-size: 17px;
    line-height: 1.75;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    /* hafif mürekkep dağılması */
    text-shadow: 0 0 .6px rgba(220, 216, 207, .55);
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .06; z-index: 10;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  ::selection { background: var(--ink); color: var(--bg); text-shadow: none; }
  a { color: inherit; text-decoration: none; }

  .wrap { max-width: 620px; margin: 0 auto; padding: 14vh 28px 18vh; }

  header { margin-bottom: 10vh; }
  h1 { font-weight: 400; font-size: 17px; letter-spacing: .04em; display: inline-block; cursor: pointer; }
  .cursor { display: inline-block; width: .6em; animation: blink 1.05s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .sub { margin-top: 6px; color: var(--dim); font-size: 14px; }

  /* liste */
  .item { display: grid; grid-template-columns: 7.5em 1fr; gap: 0 1.2em; padding: 14px 0; border-top: 1px solid var(--faint); }
  .item:last-child { border-bottom: 1px solid var(--faint); }
  .item .d { color: var(--dim); font-size: 14px; padding-top: 2px; }
  .item .t { position: relative; }
  .item:hover .t { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; }
  .item .t::before { content: "> "; position: absolute; left: -1.4em; opacity: 0; transition: opacity .15s; }
  .item:hover .t::before { opacity: 1; }

  /* yazı */
  .post .d { color: var(--dim); font-size: 14px; }
  .post h2 { font-weight: 700; font-size: 17px; margin: 4px 0 7vh; letter-spacing: .02em; min-height: 1.75em; }
  .post .body p { min-height: 1.75em; }
  .post .body .gap { height: 1.4em; }
  .post .body .sec { color: var(--dim); margin: 2.2em 0 .6em; letter-spacing: .06em; }
  .post .body .sec:first-child { margin-top: 0; }
  .post .body .slogan { font-weight: 700; letter-spacing: .04em; border: 1px solid var(--ink); padding: .5em .8em; margin: 0 0 2em; display: inline-block; transform: rotate(-.6deg); }
  .post .body p + p:not(.sec):not(.fn) { margin-top: .15em; }
  .post .body .fn { font-size: 14px; color: var(--dim); }
  .post .body .ref { margin-top: 3.5em; font-size: 14px; padding-left: 2.2em; text-indent: -2.2em; word-break: break-word; }
  .post .body .note { margin-top: 3em; padding-top: 1.2em; border-top: 1px solid var(--faint); color: var(--dim); font-style: italic; }
  .post .body .fn:first-of-type { margin-top: 0; }
  .post .body .fn { padding-left: 2em; text-indent: -2em; }
  .post .body p, .post .body .gap { opacity: 0; animation: ink .5s ease forwards; }
  @keyframes ink { from { opacity: 0; filter: blur(1.5px); } to { opacity: 1; filter: none; } }
  .end { margin-top: 6vh; color: var(--dim); }
  .nav { margin-top: 8vh; display: flex; justify-content: space-between; font-size: 14px; color: var(--dim); }
  .nav a:hover { color: var(--ink); }

  footer { margin-top: 14vh; font-size: 13px; color: var(--dim); display: flex; justify-content: space-between; }
  footer button { background: none; border: 0; color: inherit; font: inherit; cursor: pointer; }
  footer button:hover { color: var(--ink); }

  @media (max-width: 520px) {
    body { font-size: 15.5px; }
    .wrap { padding-top: 9vh; }
    .item { grid-template-columns: 1fr; }
    .item .t::before { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .post .body p, .post .body .gap { animation: none; opacity: 1; }
    .cursor { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="logo">tachysensia<span class="cursor">_</span></h1>
    <p class="sub" id="sub"></p>
  </header>

  <main id="view"></main>

  <footer>
    <span id="count"></span>
    <button id="rnd">rastgele</button>
  </footer>
</div>

<script>
/* =================================================================
   YAZILAR — en yenisini en üste ekle
   id: adres çubuğunda görünür (türkçe karakter ve boşluk kullanma)
   metin: `` arasına yaz. her satır ayrı satır, boş satır = nefes
           § ile başlayan satır = bölüm başlığı, _kelime_ = italik
           ! ile başlayan satır = slogan kutusu, (1) ile başlayan satır = dipnot
================================================================= */
const YAZILAR = [
  {
    id: "terfi",
    baslik: "terfi",
    tarih: "15.11.26",
    metin: `
bir akademisyenin gözlerinden görüyordum. bir nöbeti sırasında yerde gördüğü farenin kulağını mutfak bıçağıyla koparıp inceledi(m). oyuncak sanmıştı(m). gerçek bir kulaktı ama hâlâ plastik gibi duruyordu. parçalarına bakıp latince bir isim söyledi(m). sonra fotomontaj gibi, gözlerinden senelerin geçtiğini gördüm. işinde terfi aldıkça göğe varan bir gökdelenin katlarında yükseldi(m). her bir karede camdan dışarı bakıp ne kadar yüksekten atlarsam o kadar kesin öleceğimin hesabını yapıyordum. o kişi ben miydim, emin değilim.

& Anonim. (2026). [Rüya kaydı]. Yayımlanmamış ham veri.
`
  },
];

/* başlığın altındaki satır */
const ALT = "how to cite a hallucination in apa 7";

/* ================================================================= */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let yaziIptal = null;

function daktilo(el, metin, hiz = 55) {
  if (yaziIptal) yaziIptal();
  let i = 0, dur = false;
  el.textContent = "";
  const imlec = document.createElement("span"); imlec.className = "cursor"; imlec.textContent = "_";
  el.appendChild(imlec);
  (function adim() {
    if (dur) return;
    if (i < metin.length) {
      imlec.before(metin[i++]);
      setTimeout(adim, hiz + Math.random() * 60);
    } else setTimeout(() => imlec.remove(), 900);
  })();
  yaziIptal = () => { dur = true; };
}

function liste() {
  $("#view").innerHTML = YAZILAR.map(y =>
    `<a class="item" href="#/${y.id}" data-go="${y.id}"><span class="d">${esc(y.tarih || "")}</span><span class="t">${esc(y.baslik)}</span></a>`
  ).join("");
  $("#count").textContent = YAZILAR.length > 1 ? `${YAZILAR.length} yazı` : "";
  $("#rnd").style.display = YAZILAR.length > 1 ? "" : "none";
  document.title = "tachysensia";
}

function yazi(id) {
  const i = YAZILAR.findIndex(x => x.id === id);
  if (i < 0) return liste();
  const y = YAZILAR[i];
  const satirlar = y.metin.replace(/^\n+|\n+$/g, "").split("\n");
  const body = satirlar.map((s, k) => {
    const gecikme = `style="animation-delay:${900 + k * 70}ms"`;
    if (s.startsWith("! ")) return `<p class="slogan" ${gecikme}>${esc(s.slice(2))}</p>`;
    if (s.startsWith("& ")) return `<p class="ref" ${gecikme}>${esc(s.slice(2)).replace(/_([^_]+)_/g, "<em>$1</em>")}</p>`;
    if (s.startsWith("~ ")) return `<p class="note" ${gecikme}>${esc(s.slice(2))}</p>`;
    if (s.startsWith("— ")) return `<p class="fn" ${gecikme}>${esc(s)}</p>`;
    if (/^\(\d+\)/.test(s)) return `<p class="fn" ${gecikme}>${esc(s)}</p>`;
    if (s.startsWith("§ ")) return `<p class="sec" ${gecikme}>${esc(s.slice(2))}</p>`;
    return s.trim() ? `<p ${gecikme}>${esc(s).replace(/_([^_]+)_/g, "<em>$1</em>")}</p>` : `<div class="gap" ${gecikme}></div>`;
  }).join("");
  const onceki = YAZILAR[i + 1], sonraki = YAZILAR[i - 1];
  $("#view").innerHTML = `<article class="post">
      <div class="d">${esc(y.tarih || "")}</div>
      <h2 id="ptitle"></h2>
      <div class="body">${body}</div>
      <p class="end">—</p>
      <div class="nav">
        <a href="#/" data-go="">← hepsi</a>
        <span>${onceki ? `<a href="#/${onceki.id}" data-go="${onceki.id}">önceki</a>` : ""}${onceki && sonraki ? " · " : ""}${sonraki ? `<a href="#/${sonraki.id}" data-go="${sonraki.id}">sonraki</a>` : ""}</span>
      </div>
    </article>`;
  daktilo($("#ptitle"), y.baslik);
  $("#count").textContent = "";
  document.title = `${y.baslik} — tachysensia`;
  window.scrollTo(0, 0);
}

function ac(id) {
  if (yaziIptal) yaziIptal();
  id ? yazi(id) : liste();
}

/* adres çubuğunu güncelle (önizleme ortamlarında hata verirse sessizce geç) */
function git(id) {
  ac(id);
  try { history.pushState(null, "", id ? "#/" + id : "#/"); } catch (e) {}
}

function hashOku() {
  try { return decodeURIComponent(location.hash.replace(/^#\/?/, "")); } catch (e) { return ""; }
}

document.addEventListener("click", e => {
  const a = e.target.closest("[data-go]");
  if (!a) return;
  e.preventDefault();
  git(a.dataset.go);
});
window.addEventListener("popstate", () => ac(hashOku()));
window.addEventListener("hashchange", () => ac(hashOku()));

$("#logo").addEventListener("click", () => git(""));
$("#rnd").addEventListener("click", () => {
  git(YAZILAR[Math.floor(Math.random() * YAZILAR.length)].id);
});
$("#sub").textContent = ALT;
ac(hashOku());
</script>
</body>
</html>
